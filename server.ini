; FalloutWorld server settings, chosen by the server's founder.
;
; The server reads this file from its working folder when it starts
; (start_server.bat runs it from the repository root). An option on the
; command line with the same meaning wins over the file.

[spawn]
; Where a player comes back after dying. A player who rejoins the server
; always comes back where they left, never here.
; The value: a name from [points] below, a position "x, y, z" or
; "x, y, z, yaw" (engine units, yaw in radians, an exterior of the
; Commonwealth), or "off" (a death reloads the last checkpoint where it was
; written). In the game console `player.getpos x` (then y, z) prints the
; position, `player.getangle z` the facing in degrees (radians = degrees
; x 3.14159 / 180).
point = sanctuary

[genesis]
; The save every new character starts from: the same world_base.fos the
; clients boot when they have no checkpoint, copied next to the server. The
; server takes its sky: a player who dies inside an interior is moved
; outdoors to the respawn point with it. Without this file such a death
; falls back to the engine's reload of the last checkpoint.
save = net/genesis/world_base.fos

[points]
; Named points usable above. "sanctuary" is built in.
; redrocket = x, y, z, yaw
